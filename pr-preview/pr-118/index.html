<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tennis Coach Platform</title>

    <!--
      Home-screen and tab icons.

      These MUST be static tags in this file. iOS reads the head of the served
      HTML at bookmark time, before any JavaScript runs, so a link element
      appended at runtime is invisible to "Add to Home Screen" — the icon
      silently falls back to a screenshot or a grey tile.

      The SPA catch-all in netlify.toml (`/* -> /index.html`, 200) does not
      override real files, but it does answer requests for files that DO NOT
      exist with an HTML document and a 200. iOS probes /apple-touch-icon.png
      even with no link tag; if it receives HTML it cannot decode it and falls
      back to grey. So if an icon ever disappears from public/, the symptom is a
      200 of text/html rather than an honest 404 — check the content-type, not
      the status code.
    -->
    <link rel="apple-touch-icon" href="/TTP_Coach_Web_Public/pr-preview/pr-118/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/TTP_Coach_Web_Public/pr-preview/pr-118/favicon-32.png" />
    <link rel="manifest" href="/TTP_Coach_Web_Public/pr-preview/pr-118/manifest.webmanifest" />

    <!-- Home-screen behaviour. The manifest keeps display: "browser" for now,
         so this stays a bookmarked tab rather than a standalone app — see the
         storage-partition and permission notes before changing that. -->
    <meta name="apple-mobile-web-app-title" content="Coach" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Modern equivalent; iOS still honours the apple- prefixed one above. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default" keeps the status bar legible over the app's light surfaces;
         black-translucent would let content slide under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#CCDC48" />
    <script type="module" crossorigin src="/TTP_Coach_Web_Public/pr-preview/pr-118/assets/index-ClzKbdtN.js"></script>
    <link rel="stylesheet" crossorigin href="/TTP_Coach_Web_Public/pr-preview/pr-118/assets/index-BSGVDKaZ.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
